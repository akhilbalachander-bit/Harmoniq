<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmoniq — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:2.5rem;max-width:380px;width:100%;text-align:center}
h1{font-size:1.6rem;font-weight:800;margin-bottom:.4rem;background:linear-gradient(135deg,#a78bfa,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{color:rgba(255,255,255,0.55);font-size:.9rem;margin-bottom:1.5rem}
#status{font-size:.85rem;color:rgba(255,255,255,0.65);margin-top:1rem;min-height:1.2em}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{color:#68D391}.err{color:#FC8181}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h1>Harmoniq</h1>
  <p>Signing in with Google...</p>
  <div id="status">Opening Google sign-in...</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebaseConfig.js"></script>
<script>
const statusEl = document.getElementById('status');
const spinnerEl = document.getElementById('spinner');
(async () => {
  try {
    await firebaseManager.init();
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await firebaseManager.auth.signInWithPopup(provider);
    const user = result.user;
    try {
      await firebaseManager.db.collection('users').doc(user.uid).set({
        uid: user.uid, email: user.email,
        displayName: user.displayName || user.email.split('@')[0],
        photoURL: user.photoURL || null,
        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(e) {}
    spinnerEl.style.display = 'none';
    statusEl.className = 'ok';
    statusEl.textContent = 'Signed in as ' + user.email + '. You can close this tab.';
    setTimeout(() => window.close(), 2000);
  } catch(e) {
    spinnerEl.style.display = 'none';
    statusEl.className = 'err';
    if (e.code === 'auth/popup-blocked') {
      statusEl.textContent = 'Popup blocked. Please allow popups for this page and try again.';
    } else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      statusEl.textContent = 'Sign-in cancelled. You can close this tab.';
    } else {
      statusEl.textContent = 'Sign-in failed: ' + (e.message || 'Unknown error');
    }
  }
})();
</script>
</body>
</html>
