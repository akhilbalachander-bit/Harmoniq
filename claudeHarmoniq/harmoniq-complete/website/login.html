<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmoniq — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 1rem;
        }
        .nav-logo {
            position: fixed;
            top: 1rem;
            left: 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            opacity: 0.85;
        }
        .nav-logo:hover { opacity: 1; }
        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            backdrop-filter: blur(20px);
        }
        .card-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.3rem; }
        .card-sub { text-align: center; opacity: 0.6; font-size: 0.9rem; margin-bottom: 2rem; }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0.85rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }
        .btn-google:hover { opacity: 0.9; }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.25rem 0;
            opacity: 0.4;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 1rem;
        }
        .field label { font-size: 0.82rem; opacity: 0.75; }
        .field input {
            padding: 0.75rem 0.9rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .field input:focus { outline: none; border-color: #667eea; }
        .field input::placeholder { color: rgba(255,255,255,0.35); }
        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
            margin-top: 0.25rem;
        }
        .btn-primary:hover { opacity: 0.9; }
        .toggle-row {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            opacity: 0.65;
        }
        .toggle-row button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: inherit;
            font-weight: 600;
        }
        .error-msg {
            background: rgba(252,129,129,0.15);
            border: 1px solid rgba(252,129,129,0.3);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            color: #FC8181;
            display: none;
            margin-bottom: 0.75rem;
        }
        .success-msg {
            background: rgba(104,211,145,0.15);
            border: 1px solid rgba(104,211,145,0.3);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            color: #68D391;
            display: none;
            margin-bottom: 0.75rem;
        }
        #signedInView { display: none; text-align: center; }
        .user-avatar {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 auto 1rem;
        }
        .user-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .user-email-text { font-size: 0.85rem; opacity: 0.6; margin-bottom: 1.5rem; }
        .btn-outline {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 0.75rem;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.08); }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <a class="nav-logo" href="index.html">&#127925; Harmoniq</a>

    <div class="card">
        <!-- Sign-in form -->
        <div id="authView">
            <h1 class="card-title">Welcome back</h1>
            <p class="card-sub" id="cardSub">Sign in to sync your playlists</p>

            <button class="btn-google" id="googleBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider">or</div>

            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>

            <div class="field">
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="field">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="Your password" autocomplete="current-password">
            </div>

            <button class="btn-primary" id="emailAuthBtn">Sign In</button>

            <div class="toggle-row">
                <span id="toggleText">Don't have an account?</span>
                <button id="toggleMode">Sign Up</button>
            </div>
        </div>

        <!-- Signed-in state -->
        <div id="signedInView">
            <div class="user-avatar" id="userAvatarWeb">U</div>
            <div class="user-name" id="userNameWeb"></div>
            <div class="user-email-text" id="userEmailWeb"></div>
            <button class="btn-outline" id="signOutBtn">Sign Out</button>
            <a class="btn-primary" href="index.html" style="display:block;text-align:center;text-decoration:none;padding:0.85rem;">Back to Home</a>
        </div>
    </div>

    <a class="back-link" href="index.html">&larr; Back to Harmoniq</a>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBJoNEbVdX9N0ncY9c6wkyJjWcCEttIUqM",
            authDomain: "harmoniq-5d985.firebaseapp.com",
            projectId: "harmoniq-5d985",
            storageBucket: "harmoniq-5d985.firebasestorage.app",
            messagingSenderId: "520405889569",
            appId: "1:520405889569:web:6d314fc6b63535069ea960"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db   = firebase.firestore();

        let isSignUp = false;

        const authView      = document.getElementById('authView');
        const signedInView  = document.getElementById('signedInView');
        const errorMsg      = document.getElementById('errorMsg');
        const successMsg    = document.getElementById('successMsg');
        const emailInput    = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const emailAuthBtn  = document.getElementById('emailAuthBtn');
        const toggleMode    = document.getElementById('toggleMode');
        const toggleText    = document.getElementById('toggleText');
        const cardSub       = document.getElementById('cardSub');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }
        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }
        function clearMsgs() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        toggleMode.addEventListener('click', () => {
            isSignUp = !isSignUp;
            clearMsgs();
            if (isSignUp) {
                emailAuthBtn.textContent = 'Create Account';
                toggleMode.textContent = 'Sign In';
                toggleText.textContent = 'Already have an account?';
                cardSub.textContent = 'Create your Harmoniq account';
            } else {
                emailAuthBtn.textContent = 'Sign In';
                toggleMode.textContent = 'Sign Up';
                toggleText.textContent = "Don't have an account?";
                cardSub.textContent = 'Sign in to sync your playlists';
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            clearMsgs();
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
            } catch (err) {
                const msgs = {
                    'auth/popup-closed-by-user': 'Sign-in cancelled.',
                    'auth/popup-blocked': 'Popup blocked — please allow popups for this site.'
                };
                showError(msgs[err.code] || err.message);
            }
        });

        emailAuthBtn.addEventListener('click', async () => {
            clearMsgs();
            const email = emailInput.value.trim();
            const pass  = passwordInput.value;
            if (!email || !pass) { showError('Please enter your email and password.'); return; }
            try {
                if (isSignUp) {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    showSuccess('Account created!');
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (err) {
                const msgs = {
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/user-not-found': 'No account found with that email.',
                    'auth/email-already-in-use': 'An account with this email already exists.',
                    'auth/weak-password': 'Password must be at least 6 characters.',
                    'auth/invalid-email': 'Please enter a valid email address.'
                };
                showError(msgs[err.code] || err.message);
            }
        });

        // Allow Enter key to submit
        [emailInput, passwordInput].forEach(el => {
            el.addEventListener('keydown', e => { if (e.key === 'Enter') emailAuthBtn.click(); });
        });

        document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

        // Auth state
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                authView.style.display = 'none';
                signedInView.style.display = 'block';
                const initials = (user.displayName || user.email || 'U')[0].toUpperCase();
                document.getElementById('userAvatarWeb').textContent = initials;
                document.getElementById('userNameWeb').textContent = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmailWeb').textContent = user.email;
                // Save profile
                try {
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                } catch (_) {}
            } else {
                authView.style.display = 'block';
                signedInView.style.display = 'none';
            }
        });
    </script>
</body>
</html>
